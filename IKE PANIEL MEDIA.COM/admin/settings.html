<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="admin-settings">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="brand brand-admin"><img class="brand-mark" src="../assets/images/logo/ike-peniel-logo.png" alt="Ike Peniel Media logo"></div>
        <span>Portfolio Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="projects.html">Portfolio</a>
        <a href="add-project.html">Add Work</a>
        <a href="categories.html">Categories</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="messages.html">Messages</a>
        <a href="hire-requests.html">Hire Requests</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html" class="active">Settings</a>
        <button type="button" class="sidebar-logout" id="logoutButton">Logout</button>
      </nav>
    </aside>

    <main class="admin-content">
      <header class="admin-topbar">
        <h1>Website Settings</h1>
      </header>

      <form id="settingsForm" class="base-form admin-form">
        <div class="form-row two-col">
          <div>
            <label for="website_name">Website Name</label>
            <input type="text" id="website_name" name="website_name" value="Ike Peniel Media">
          </div>
          <div>
            <label for="developer_name">Developer Name</label>
            <input type="text" id="developer_name" name="developer_name" value="JTECH SOLUTIONS">
          </div>
        </div>
        <div class="form-row two-col">
          <div>
            <label for="designer_name">Designer Name</label>
            <input type="text" id="designer_name" name="designer_name" value="Ike Peniel Media">
          </div>
          <div>
            <label for="designer_email">Email</label>
            <input type="email" id="designer_email" name="designer_email" value="istawiah2134@gmail.com">
          </div>
        </div>
        <div>
          <label for="website_title">Website Title</label>
          <input type="text" id="website_title" name="website_title">
        </div>
        <div>
          <label for="website_description">Website Description</label>
          <textarea id="website_description" name="website_description" rows="4"></textarea>
        </div>
        <div class="form-row two-col">
          <div>
            <label for="designer_phone">Phone</label>
            <input type="text" id="designer_phone" name="designer_phone" value="+233 20 696 3041">
          </div>
          <div>
            <label for="designer_whatsapp">WhatsApp</label>
            <input type="text" id="designer_whatsapp" name="designer_whatsapp" value="+233 53 234 9114">
          </div>
        </div>
        <div>
          <label for="designer_location">Location</label>
          <input type="text" id="designer_location" name="designer_location" value="Ghana">
        </div>
        <div class="form-row two-col">
          <div>
            <label for="facebook">Facebook</label>
            <input type="url" id="facebook" name="facebook">
          </div>
          <div>
            <label for="instagram">Instagram</label>
            <input type="url" id="instagram" name="instagram">
          </div>
        </div>
        <div class="form-row two-col">
          <div>
            <label for="tiktok">TikTok</label>
            <input type="url" id="tiktok" name="tiktok">
          </div>
          <div>
            <label for="linkedin">LinkedIn</label>
            <input type="url" id="linkedin" name="linkedin">
          </div>
        </div>
        <div class="form-row two-col">
          <div>
            <label for="behance">Behance</label>
            <input type="url" id="behance" name="behance">
          </div>
          <div>
            <label for="dribbble">Dribbble</label>
            <input type="url" id="dribbble" name="dribbble">
          </div>
        </div>
        <div>
          <label for="youtube">YouTube</label>
          <input type="url" id="youtube" name="youtube">
        </div>
        <div>
          <label for="footer_copyright">Footer Copyright</label>
          <input type="text" id="footer_copyright" name="footer_copyright">
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="../js/admin.js"></script>
</body>
</html>
