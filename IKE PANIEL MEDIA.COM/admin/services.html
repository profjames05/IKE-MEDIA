<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="admin-services">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="brand brand-admin"><img class="brand-mark" src="../assets/images/logo/ike-peniel-logo.png" alt="Ike Peniel Media logo"></div>
        <span>Portfolio Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="home-content.html">Home Content</a>
        <a href="services.html" class="active">Services</a>
        <a href="projects.html">Portfolio</a>
        <a href="add-project.html">Add Work</a>
        <a href="categories.html">Categories</a>
        <a href="media.html">Media</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="messages.html">Messages</a>
        <a href="hire-requests.html">Hire Requests</a>
        <a href="settings.html">Settings</a>
        <button type="button" class="sidebar-logout" id="logoutButton">Logout</button>
      </nav>
    </aside>

    <main class="admin-content">
      <header class="admin-topbar">
        <h1>Service Management</h1>
      </header>

      <form id="serviceForm" class="base-form admin-form">
        <div class="form-row two-col">
          <div>
            <label for="service-title">Title</label>
            <input type="text" id="service-title" name="title" required>
          </div>
          <div>
            <label for="service-icon">Icon</label>
            <input type="text" id="service-icon" name="icon" value="✦">
          </div>
        </div>
        <div>
          <label for="service-description">Description</label>
          <textarea id="service-description" name="description" rows="4" required></textarea>
        </div>
        <div class="form-row two-col">
          <div>
            <label for="service-sort-order">Order</label>
            <input type="number" id="service-sort-order" name="sort_order" value="0">
          </div>
          <div class="checkbox-wrap" style="padding-top: 32px;">
            <label><input type="checkbox" name="published" checked> Publish</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Save Service</button>
      </form>

      <section class="panel" style="margin-top: 28px;">
        <div class="panel-header"><h2>Services List</h2></div>
        <div id="servicesTableBody" class="mini-list"></div>
      </section>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="../js/admin.js"></script>
</body>
</html>
