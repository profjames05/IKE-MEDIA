<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <meta name="description" content="Dashboard overview of portfolio content, messages, testimonials, and project management.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="admin-dashboard">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="brand brand-admin"><img class="brand-mark" src="../assets/images/logo/ike-peniel-logo.png" alt="Ike Peniel Media logo"></div>
        <span>Portfolio Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="projects.html">Portfolio</a>
        <a href="add-project.html">Add Work</a>
        <a href="categories.html">Categories</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="messages.html">Messages</a>
        <a href="hire-requests.html">Hire Requests</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <button type="button" class="sidebar-logout" id="logoutButton">Logout</button>
      </nav>
    </aside>

    <main class="admin-content">
      <header class="admin-topbar">
        <h1>Dashboard</h1>
        <div class="admin-user">
          <span>Welcome, Admin</span>
        </div>
      </header>

      <div class="stats-grid">
        <div class="stat-card">
          <span>Total Works</span>
          <strong id="total-works">0</strong>
        </div>
        <div class="stat-card">
          <span>Total Categories</span>
          <strong id="total-categories">0</strong>
        </div>
        <div class="stat-card">
          <span>Total Messages</span>
          <strong id="total-messages">0</strong>
        </div>
        <div class="stat-card">
          <span>Total Testimonials</span>
          <strong id="total-testimonials">0</strong>
        </div>
        <div class="stat-card">
          <span>Total Hire Requests</span>
          <strong id="total-hire-requests">0</strong>
        </div>
      </div>

      <div class="dashboard-panels">
        <section class="panel">
          <div class="panel-header"><h2>Recent uploads</h2></div>
          <div id="recent-projects" class="mini-list"></div>
        </section>
        <section class="panel">
          <div class="panel-header"><h2>Recent messages</h2></div>
          <div id="recent-messages" class="mini-list"></div>
        </section>
      </div>

      <section class="panel">
        <div class="panel-header"><h2>Category statistics</h2></div>
        <div id="category-stats" class="category-stats"></div>
      </section>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="../js/admin.js"></script>
</body>
</html>
