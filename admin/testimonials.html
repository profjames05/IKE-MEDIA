<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="admin-testimonials">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="brand brand-admin"><img class="brand-mark" src="../assets/images/logo/ike-peniel-logo.png" alt="Ike Peniel Media logo"></div>
        <span>Portfolio Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="projects.html">Portfolio</a>
        <a href="add-project.html">Add Work</a>
        <a href="categories.html">Categories</a>
        <a href="testimonials.html" class="active">Testimonials</a>
        <a href="messages.html">Messages</a>
        <a href="hire-requests.html">Hire Requests</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <button type="button" class="sidebar-logout" id="logoutButton">Logout</button>
      </nav>
    </aside>

    <main class="admin-content">
      <header class="admin-topbar">
        <h1>Testimonials</h1>
      </header>

      <form id="testimonialForm" class="base-form admin-form" enctype="multipart/form-data">
        <div class="form-row two-col">
          <div>
            <label for="testimonial-name">Client name</label>
            <input type="text" id="testimonial-name" name="name" required>
          </div>
          <div>
            <label for="testimonial-company">Company</label>
            <input type="text" id="testimonial-company" name="company">
          </div>
        </div>
        <div class="form-row two-col">
          <div>
            <label for="testimonial-position">Position</label>
            <input type="text" id="testimonial-position" name="position">
          </div>
          <div>
            <label for="testimonial-rating">Rating</label>
            <input type="number" id="testimonial-rating" name="rating" min="1" max="5" value="5">
          </div>
        </div>
        <div>
          <label for="testimonial-message">Message</label>
          <textarea id="testimonial-message" name="message" rows="5" required></textarea>
        </div>
        <div>
          <label for="testimonial-image">Image</label>
          <input type="file" id="testimonial-image" name="image" accept="image/jpeg,image/png,image/webp">
        </div>
        <div class="checkbox-wrap">
          <label><input type="checkbox" name="status" value="published" checked> Publish</label>
        </div>
        <button type="submit" class="btn btn-primary">Add Testimonial</button>
      </form>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Company</th>
              <th>Rating</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="testimonialsTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="../js/admin.js"></script>
</body>
</html>
